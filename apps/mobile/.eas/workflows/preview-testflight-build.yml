# Manual only: builds the owner's preview binary and uploads it to the same
# App Store Connect app (TestFlight). There are no OTA updates: run it again
# for every change that testers should get. It never runs on push.
name: Blumi preview build to TestFlight

on:
  workflow_dispatch: {}

jobs:
  checks:
    name: Require full Verify for this commit, then check source, types, lint, tests and dependency audit
    environment: production
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Run release checks
        working_directory: ../..
        run: |
          set -euo pipefail
          # The full `npm run verify` (PostgreSQL, rig, Expo Doctor) runs in GitHub Verify;
          # the build only starts for a commit where that run succeeded.
          node scripts/security/require-verify-run.mjs
          node -e "require('./apps/mobile/scripts/mobile-release-assets.cjs').assertShowcaseLooksOwnerApproved('tools/avatar25d/showcase-baked.json')"
          npm run verify:source-hygiene
          npm run build:packages
          npm run typecheck
          npm run lint
          npm test
          npm run audit:release

  build_preview_ios:
    name: Build the iOS preview binary
    needs: [checks]
    type: build
    environment: production
    params:
      platform: ios
      profile: preview

  submit_preview_ios:
    name: Upload the preview build to App Store Connect
    needs: [build_preview_ios]
    type: submit
    environment: production
    params:
      build_id: ${{ needs.build_preview_ios.outputs.build_id }}
      profile: preview

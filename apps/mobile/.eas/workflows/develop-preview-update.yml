# develop → the owner's development build on TestFlight, over the air.
# Publishes the JavaScript and assets as an OTA update
# to the `preview` channel only, and only when a preview build with the same
# native runtime (fingerprint) already exists. It never builds: a native
# change (new native module, permission, entitlement, plugin or app config
# that affects native code) stops the run and asks for a new preview build
# (preview-testflight-build.yml). Production testers never receive these
# updates because their binaries listen to the `production` channel.
# Speed matters here: the release checks run before the push (locally) and on
# GitHub (verify.yml), not again in this workflow, so an update reaches the
# development build in minutes. main keeps the checks before production.
name: Blumi develop to preview (OTA)

on:
  push:
    branches:
      - develop
  workflow_dispatch: {}

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  fingerprint:
    name: Fingerprint the native runtime
    type: fingerprint
    environment: production
    # Must equal build.preview.env in eas.json (checked by
    # scripts/mobile-release-channels.test.mjs) or the fingerprint differs.
    env:
      EAS_BUILD_PROFILE: preview
      EXPO_PUBLIC_BLUMI_BUILD_PROFILE: preview
      EXPO_PUBLIC_BLUMI_MEDIA_MODE: native
      EXPO_PUBLIC_BLUMI_ENABLE_DEMO: "0"
      EXPO_PUBLIC_BLUMI_VOICE_ENABLED: "0"
      EXPO_PUBLIC_BLUMI_PAID_COINS_ENABLED: "0"
      EXPO_PUBLIC_BLUMI_QA_UNLOCK_AVATAR_ITEMS: "0"

  get_preview_build:
    name: Find a preview build with this native runtime
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: preview
      channel: preview
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}

  publish_preview_update:
    name: Publish an OTA update to the preview channel
    needs: [get_preview_build]
    if: ${{ needs.get_preview_build.outputs.build_id }}
    type: update
    environment: production
    env:
      EAS_BUILD_PROFILE: preview
      EXPO_PUBLIC_BLUMI_BUILD_PROFILE: preview
      EXPO_PUBLIC_BLUMI_MEDIA_MODE: native
      EXPO_PUBLIC_BLUMI_ENABLE_DEMO: "0"
      EXPO_PUBLIC_BLUMI_VOICE_ENABLED: "0"
      EXPO_PUBLIC_BLUMI_PAID_COINS_ENABLED: "0"
      EXPO_PUBLIC_BLUMI_QA_UNLOCK_AVATAR_ITEMS: "0"
    params:
      channel: preview
      platform: ios

  native_build_required:
    name: Stop - this change needs a new preview build
    needs: [get_preview_build]
    if: ${{ !needs.get_preview_build.outputs.build_id }}
    steps:
      - name: Explain why nothing was published
        run: |
          echo "No preview build matches this native runtime (fingerprint)."
          echo "The change touches native code or native config, so an OTA update would not run on the installed app."
          echo "Nothing was published. Run the 'Blumi preview build to TestFlight' workflow once, install that build from TestFlight, then push to develop again."
          exit 1

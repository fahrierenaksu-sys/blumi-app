# main → stable Blumi for testers (and later the App Store).
# Runs the checks, then builds a new iOS production binary and uploads it to
# TestFlight. The app has no OTA updates (owner decision 2026-10-08,
# ported to develop 2026-10-10): every JavaScript change ships in a new binary.
# Started by hand only (EAS dashboard or `eas workflow:run testflight.yml`)
# so pushes to main never spend EAS build quota or upload on their own.
name: Blumi main to production

on:
  workflow_dispatch: {}

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  checks:
    name: Require full Verify for this commit, then check source, types, lint, tests and dependency audit
    environment: production
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Run release checks
        working_directory: ../..
        run: |
          set -euo pipefail
          # The full `npm run verify` (PostgreSQL, rig, Expo Doctor) runs in GitHub Verify;
          # the build only starts for a commit where that run succeeded.
          node scripts/security/require-verify-run.mjs
          node -e "require('./apps/mobile/scripts/mobile-release-assets.cjs').assertShowcaseLooksOwnerApproved('tools/avatar25d/showcase-baked.json')"
          npm run verify:source-hygiene
          npm run build:packages
          npm run typecheck
          npm run lint
          npm test
          npm run audit:release

  build_ios:
    name: Build a new iOS production binary
    needs: [checks]
    type: build
    environment: production
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Upload iOS build to App Store Connect
    needs: [build_ios]
    type: submit
    environment: production
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production

# main → stable Blumi for testers (and later the App Store).
# Runs the checks, then compares the native fingerprint with existing
# production builds. Same native runtime: publish an OTA update to the
# `production` channel only (no new build). Native change: build a new iOS
# production binary and upload it to TestFlight. Development updates never
# reach this channel; they go to `preview` (see develop-preview-update.yml).
# Started by hand only (EAS dashboard or `eas workflow:run testflight.yml`)
# so pushes to main never spend EAS build quota or upload on their own.
name: Blumi main to production

on:
  workflow_dispatch: {}

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  checks:
    name: Check source, types, lint, tests and dependency audit
    environment: production
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Run release checks
        working_directory: ../..
        run: |
          set -euo pipefail
          npm run verify:source-hygiene
          npm run build:packages
          npm run typecheck
          npm run lint
          npm test
          npm run audit:release

  fingerprint:
    name: Fingerprint the native runtime
    needs: [checks]
    type: fingerprint
    environment: production
    # Must equal build.production.env in eas.json (checked by
    # scripts/mobile-release-channels.test.mjs) or the fingerprint differs.
    env:
      EAS_BUILD_PROFILE: production
      EXPO_PUBLIC_BLUMI_BUILD_PROFILE: production
      EXPO_PUBLIC_BLUMI_MEDIA_MODE: native
      EXPO_PUBLIC_BLUMI_ENABLE_DEMO: "0"
      EXPO_PUBLIC_BLUMI_VOICE_ENABLED: "0"
      EXPO_PUBLIC_BLUMI_PAID_COINS_ENABLED: "0"
      EXPO_PUBLIC_BLUMI_QA_UNLOCK_AVATAR_ITEMS: "0"

  get_production_build:
    name: Find a production build with this native runtime
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: production
      channel: production
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}

  publish_production_update:
    name: Publish an OTA update to the production channel
    needs: [get_production_build]
    if: ${{ needs.get_production_build.outputs.build_id }}
    type: update
    environment: production
    env:
      EAS_BUILD_PROFILE: production
      EXPO_PUBLIC_BLUMI_BUILD_PROFILE: production
      EXPO_PUBLIC_BLUMI_MEDIA_MODE: native
      EXPO_PUBLIC_BLUMI_ENABLE_DEMO: "0"
      EXPO_PUBLIC_BLUMI_VOICE_ENABLED: "0"
      EXPO_PUBLIC_BLUMI_PAID_COINS_ENABLED: "0"
      EXPO_PUBLIC_BLUMI_QA_UNLOCK_AVATAR_ITEMS: "0"
    params:
      channel: production
      platform: ios

  build_ios:
    name: Build a new iOS production binary (native change)
    needs: [get_production_build]
    if: ${{ !needs.get_production_build.outputs.build_id }}
    type: build
    environment: production
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Upload iOS build to App Store Connect
    needs: [build_ios]
    type: submit
    environment: production
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production

appId: com.blumi.mobile
env:
  SLOT: "1"
  ITEM_SLUG: "mocha_ribbon_waves"
---
- runFlow: ../subflows/sign_in.yaml
- runFlow: ../subflows/shop_buy.yaml
- assertVisible:
    id: "shop-coin-balance"
# Owned items appear in the wardrobe closet.
- runFlow: ../subflows/open_wardrobe.yaml
- tapOn:
    id: "wardrobe-category-hair"
- assertVisible:
    id: "wardrobe-item-${ITEM_SLUG}"
- takeScreenshot: out/03_girl_inventory

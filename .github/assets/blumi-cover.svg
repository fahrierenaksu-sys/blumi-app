<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Blumi — Start with a conversation. Build a shared world.</title>
  <desc id="desc">A rose and lavender cover with three connected cards representing identity, conversation, and shared spaces.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#FFF3F5"/><stop offset=".55" stop-color="#F4ECFF"/><stop offset="1" stop-color="#E9F4FF"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#D8588C"/><stop offset="1" stop-color="#8764C9"/></linearGradient>
  </defs>
  <rect width="1200" height="440" rx="28" fill="url(#bg)"/>
  <circle cx="1100" cy="20" r="185" fill="#DAC8F4" opacity=".35"/>
  <circle cx="670" cy="470" r="190" fill="#F4C6D7" opacity=".3"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="62" y="57" width="185" height="28" rx="14" fill="#FFFFFF" opacity=".85"/>
    <text x="80" y="76" font-size="11" font-weight="700" letter-spacing="2" fill="#805475">A SPACE TO CONNECT</text>
    <text x="58" y="190" font-size="100" font-weight="700" letter-spacing="-5" fill="#49334F">blumi<tspan fill="#CE628D">.</tspan></text>
    <text x="64" y="245" font-size="27" font-weight="700" fill="#49334F">Start with a conversation.</text>
    <text x="64" y="283" font-size="27" fill="#715E7B">Build a shared world.</text>
    <text x="65" y="362" font-size="12" letter-spacing="2" fill="#826D8C">AVATARS · CONNECTIONS · SHARED ROOMS</text>
    <path d="M765 155 Q1030 100 1010 260 Q1000 350 820 325" fill="none" stroke="#BCA1D9" stroke-width="2" stroke-dasharray="6 8"/>
    <g transform="translate(720 63) rotate(-6 95 70)">
      <rect width="204" height="130" rx="22" fill="#FFFFFF" stroke="#E8DBEE"/>
      <circle cx="43" cy="42" r="20" fill="#F8DEEB"/>
      <circle cx="43" cy="37" r="6" fill="#C66693"/>
      <path d="M32 51 Q43 37 54 51" fill="#C66693"/>
      <text x="24" y="88" font-size="17" font-weight="700" fill="#49334F">Your own identity</text>
      <text x="24" y="111" font-size="12" fill="#826D8C">Make it feel like you.</text>
    </g>
    <g transform="translate(917 174) rotate(7 95 70)">
      <rect width="204" height="130" rx="22" fill="#FFFFFF" stroke="#E8DBEE"/>
      <rect x="24" y="22" width="36" height="27" rx="9" fill="#E8DFF8"/>
      <path d="M31 45 L31 55 L43 45" fill="#E8DFF8"/>
      <circle cx="34" cy="35" r="2" fill="#9570BE"/><circle cx="43" cy="35" r="2" fill="#9570BE"/><circle cx="52" cy="35" r="2" fill="#9570BE"/>
      <text x="24" y="88" font-size="17" font-weight="700" fill="#49334F">A little hello</text>
      <text x="24" y="111" font-size="12" fill="#826D8C">See where it takes you.</text>
    </g>
    <g transform="translate(691 252) rotate(-3 100 70)">
      <rect width="204" height="130" rx="22" fill="url(#accent)"/>
      <path d="M27 42 L43 27 L59 42 M32 40 V57 H54 V40" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="89" font-size="17" font-weight="700" fill="#FFFFFF">Somewhere together</text>
      <text x="24" y="112" font-size="12" fill="#FFFFFF">A room for your connection.</text>
    </g>
  </g>
</svg>

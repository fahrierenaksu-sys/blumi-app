name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install PostgreSQL test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - name: Install locked dependencies
        run: npm ci
      - name: Verify source, tests, PostgreSQL and release checks
        run: npm run verify

name: Verify

on:
  push:
    branches: [main, "release/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install PostgreSQL test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - name: Install locked dependencies
        run: npm ci
      - name: Install avatar rig gate tools
        run: sudo apt-get install -y python3-numpy python3-pil
      - name: Verify Firebase SMS blocking function
        run: |
          npm ci --ignore-scripts --prefix tools/firebase-sms-defense/functions
          node tools/firebase-sms-defense/build.mjs
          npm test --prefix tools/firebase-sms-defense/functions
          npm audit --omit=dev --prefix tools/firebase-sms-defense/functions
      - name: Verify source, tests, PostgreSQL and release checks
        run: npm run verify

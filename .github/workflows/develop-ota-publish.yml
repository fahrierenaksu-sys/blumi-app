# develop -> OTA update to the `preview` channel (the owner's TestFlight
# development build), published from GitHub Actions so it skips the EAS
# workflow queue. It publishes only when a finished `preview` iOS build has the
# same native runtime (fingerprint); otherwise the job fails and asks for a new
# preview build. The EAS workflow develop-preview-update.yml stays as a manual
# fallback. Needs the EXPO_TOKEN repository secret.
# Manual only: the iOS bundle carries about 1220 assets and EAS Update accepts
# at most 1000 per update, so publishing fails until that count drops.
name: Publish OTA to preview channel

on:
  workflow_dispatch: {}

concurrency:
  group: develop-ota-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: apps/mobile
    # Must equal build.preview.env in apps/mobile/eas.json (checked by
    # scripts/mobile-release-channels.test.mjs) or the update's runtime differs.
    env:
      EAS_BUILD_PROFILE: preview
      EXPO_PUBLIC_BLUMI_BUILD_PROFILE: preview
      EXPO_PUBLIC_BLUMI_MEDIA_MODE: native
      EXPO_PUBLIC_BLUMI_ENABLE_DEMO: "0"
      EXPO_PUBLIC_BLUMI_VOICE_ENABLED: "0"
      EXPO_PUBLIC_BLUMI_PAID_COINS_ENABLED: "0"
      EXPO_PUBLIC_BLUMI_QA_UNLOCK_AVATAR_ITEMS: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: 24.8.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Load the EAS production variables
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/eas-production.env"
          # app.config.js requires the API URLs for the preview profile, and
          # eas reads it before it can pull them, so pull without the profile.
          env -u EAS_BUILD_PROFILE -u EXPO_PUBLIC_BLUMI_BUILD_PROFILE \
            eas env:pull production --non-interactive --path "$env_file"
          echo "Loaded EAS production variables:"
          grep -E '^[A-Za-z_][A-Za-z0-9_]*=' "$env_file" | cut -d= -f1
          set -a
          # shellcheck disable=SC1090
          source "$env_file"
          set +a
          # Later steps see these values; the job env (build.preview.env) wins.
          grep -E '^[A-Za-z_][A-Za-z0-9_]*=' "$env_file" | cut -d= -f1 | while read -r name; do
            case "$name" in
              EAS_BUILD_PROFILE|EXPO_PUBLIC_BLUMI_BUILD_PROFILE|EXPO_PUBLIC_BLUMI_MEDIA_MODE|EXPO_PUBLIC_BLUMI_ENABLE_DEMO|EXPO_PUBLIC_BLUMI_VOICE_ENABLED|EXPO_PUBLIC_BLUMI_PAID_COINS_ENABLED|EXPO_PUBLIC_BLUMI_QA_UNLOCK_AVATAR_ITEMS) continue ;;
            esac
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done
          rm -f "$env_file"

      - name: Check the app config
        run: npx expo config --json > /dev/null

      - name: Find the latest preview build
        id: build
        run: |
          set -euo pipefail
          output_file="$(mktemp)"
          if ! eas build:list --platform ios --channel preview --build-profile preview \
            --status finished --limit 1 --json --non-interactive >"$output_file" 2>"$RUNNER_TEMP/build-list.err"; then
            echo "::error::EAS build lookup failed."
            cat "$RUNNER_TEMP/build-list.err" "$output_file"
            exit 1
          fi
          node - "$output_file" <<'NODE' >> "$GITHUB_OUTPUT"
          const text = require("node:fs").readFileSync(process.argv[2], "utf8");
          const [build] = JSON.parse(text.slice(text.indexOf("[")));
          if (!build?.id) {
            console.error("No finished preview build was found.");
            process.exit(1);
          }
          console.log(`id=${build.id}`);
          console.error(`Latest preview build ${build.id} (build ${build.appBuildVersion ?? "?"})`);
          NODE

      - name: Check that the build can run this JavaScript
        id: compare
        run: |
          set -euo pipefail
          # EAS compares the build's recorded fingerprint with this checkout the
          # same way it fingerprinted the build.
          output="$(eas fingerprint:compare --build-id "${{ steps.build.outputs.id }}" \
            --environment production --non-interactive 2>&1)" || true
          echo "$output"
          runtime="$(sed -nE 's/.*Fingerprint ([0-9a-f]+) from IOS build matches fingerprint ([0-9a-f]+).*/\1/p' <<<"$output" | head -1)"
          if [ -z "$runtime" ]; then
            echo "::error::This change touches native code or config, so preview build ${{ steps.build.outputs.id }} cannot run it. Run the 'Blumi preview build to TestFlight' EAS workflow, install that build, then push again. Nothing was published."
            exit 1
          fi
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"

      - name: Publish the OTA update
        run: |
          set -euo pipefail
          output_file="$(mktemp)"
          if ! eas update --channel preview --platform ios --environment production \
            --message "$(git log -1 --pretty=%s)" --json --non-interactive >"$output_file" 2>"$RUNNER_TEMP/update.err"; then
            echo "::error::eas update failed."
            cat "$RUNNER_TEMP/update.err" "$output_file"
            exit 1
          fi
          node - "$output_file" "${{ steps.compare.outputs.runtime }}" <<'NODE'
          const text = require("node:fs").readFileSync(process.argv[2], "utf8");
          const expected = process.argv[3];
          const runtimes = [...text.matchAll(/"runtimeVersion"\s*:\s*"([^"]+)"/g)].map((match) => match[1]);
          const group = text.match(/"group"\s*:\s*"([^"]+)"/)?.[1];
          if (runtimes.length === 0 || runtimes.some((runtime) => runtime !== expected)) {
            console.log(text);
            console.log(`::error::The update's runtime (${runtimes.join(", ") || "none"}) is not the preview build's (${expected}); the phone will not receive it.`);
            process.exit(1);
          }
          console.log(`Published update group ${group} for runtime ${expected}.`);
          NODE

# develop -> OTA update to the `preview` channel (the owner's TestFlight
# development build), published from GitHub Actions so it skips the EAS
# workflow queue. It publishes only when a finished `preview` iOS build has the
# same native runtime (fingerprint); otherwise the job fails and asks for a new
# preview build. The EAS workflow develop-preview-update.yml stays as a manual
# fallback. Needs the EXPO_TOKEN repository secret.
name: Publish OTA to preview channel

on:
  push:
    branches:
      - develop
  workflow_dispatch: {}

concurrency:
  group: develop-ota-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: apps/mobile
    # Must equal build.preview.env in apps/mobile/eas.json (checked by
    # scripts/mobile-release-channels.test.mjs) or the update's runtime differs.
    env:
      EAS_BUILD_PROFILE: preview
      EXPO_PUBLIC_BLUMI_BUILD_PROFILE: preview
      EXPO_PUBLIC_BLUMI_MEDIA_MODE: native
      EXPO_PUBLIC_BLUMI_ENABLE_DEMO: "0"
      EXPO_PUBLIC_BLUMI_VOICE_ENABLED: "0"
      EXPO_PUBLIC_BLUMI_PAID_COINS_ENABLED: "0"
      EXPO_PUBLIC_BLUMI_QA_UNLOCK_AVATAR_ITEMS: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: 24.8.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Load the EAS production variables
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/eas-production.env"
          # app.config.js requires the API URLs for the preview profile, and
          # eas reads it before it can pull them, so pull without the profile.
          env -u EAS_BUILD_PROFILE -u EXPO_PUBLIC_BLUMI_BUILD_PROFILE \
            eas env:pull production --non-interactive --path "$env_file"
          echo "Loaded EAS production variables:"
          grep -E '^[A-Za-z_][A-Za-z0-9_]*=' "$env_file" | cut -d= -f1
          set -a
          # shellcheck disable=SC1090
          source "$env_file"
          set +a
          # Later steps see these values; the job env (build.preview.env) wins.
          grep -E '^[A-Za-z_][A-Za-z0-9_]*=' "$env_file" | cut -d= -f1 | while read -r name; do
            case "$name" in
              EAS_BUILD_PROFILE|EXPO_PUBLIC_BLUMI_BUILD_PROFILE|EXPO_PUBLIC_BLUMI_MEDIA_MODE|EXPO_PUBLIC_BLUMI_ENABLE_DEMO|EXPO_PUBLIC_BLUMI_VOICE_ENABLED|EXPO_PUBLIC_BLUMI_PAID_COINS_ENABLED|EXPO_PUBLIC_BLUMI_QA_UNLOCK_AVATAR_ITEMS) continue ;;
            esac
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done
          rm -f "$env_file"

      - name: Check the app config
        run: npx expo config --json > /dev/null

      - name: Fingerprint the native runtime
        id: fingerprint
        run: |
          set -euo pipefail

          output_file="$(mktemp)"
          error_file="$(mktemp)"

          # The job env carries build.preview.env; --environment loads the EAS
          # production variables (API URLs) that app.config.js requires.
          if ! eas fingerprint:generate \
            --platform ios \
            --environment production \
            --json \
            --non-interactive \
            >"$output_file" 2>"$error_file"; then
            echo "::error::EAS fingerprint generation failed."
            cat "$error_file"
            cat "$output_file"
            exit 1
          fi

          # Extract the hash even if the CLI adds non-JSON text to stdout.
          hash="$(
            node - "$output_file" <<'NODE'
          const fs = require("node:fs");

          const output = fs.readFileSync(process.argv[2], "utf8");
          const match = output.match(/"hash"\s*:\s*"([^"]+)"/);

          if (!match) {
            process.exit(1);
          }

          process.stdout.write(match[1]);
          NODE
          )" || {
            echo "::error::Could not find a fingerprint hash in EAS output."
            cat "$output_file"
            exit 1
          }

          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "iOS fingerprint: $hash"

      - name: Find a preview build with this native runtime
        id: build
        run: |
          set -euo pipefail

          output_file="$(mktemp)"
          error_file="$(mktemp)"

          if ! eas build:list \
            --platform ios \
            --channel preview \
            --build-profile preview \
            --fingerprint-hash "${{ steps.fingerprint.outputs.hash }}" \
            --status finished \
            --limit 1 \
            --json \
            --non-interactive \
            >"$output_file" 2>"$error_file"; then
            echo "::error::EAS build lookup failed."
            cat "$error_file"
            cat "$output_file"
            exit 1
          fi

          build_id="$(
            node - "$output_file" <<'NODE'
          const fs = require("node:fs");

          const output = fs.readFileSync(process.argv[2], "utf8");
          const match = output.match(/"id"\s*:\s*"([^"]+)"/);

          if (!match) {
            process.exit(1);
          }

          process.stdout.write(match[1]);
          NODE
          )" || {
            echo "::error::No finished preview build was found for fingerprint ${{ steps.fingerprint.outputs.hash }}. This change touches native code or config: run the 'Blumi preview build to TestFlight' EAS workflow, install that build, then push again. Nothing was published."
            cat "$output_file"
            latest_id="$(eas build:list --platform ios --channel preview --build-profile preview \
              --status finished --limit 1 --json --non-interactive 2>/dev/null \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const m=s.match(/"id"\s*:\s*"([^"]+)"/);if(m)process.stdout.write(m[1])})')" || true
            if [ -n "$latest_id" ]; then
              echo "Differences from the latest preview build ($latest_id):"
              eas fingerprint:compare --build-id "$latest_id" --environment production --non-interactive || true
            fi
            exit 1
          }

          echo "Matching preview build: $build_id"

      - name: Publish the OTA update
        run: |
          eas update --channel preview --platform ios --environment production \
            --message "$(git log -1 --pretty=%s)" --non-interactive
